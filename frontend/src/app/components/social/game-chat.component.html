<div class="game-chat flex h-full flex-col rounded-2xl border border-zinc-800 bg-zinc-900/50 ring-1 ring-white/5">
  <div
    class="border-b border-zinc-800 px-3 py-2 font-display text-xs font-semibold text-board-light"
  >
    Game chat
  </div>
  <div class="min-h-[140px] flex-1 space-y-1 overflow-y-auto p-2 text-xs">
    @if (messages.length === 0) {
      <p class="text-zinc-600">No messages yet.</p>
    }
    @for (m of messages; track m.id) {
      <div
        class="rounded-md px-2 py-1"
        [ngClass]="
          m.fromUserId === myUserId
            ? 'bg-amber-500/10'
            : 'bg-zinc-950/40'
        "
      >
        <span class="font-medium text-amber-200/90">{{ m.fromUsername }}</span>
        <span class="text-zinc-500">· {{ m.createdAt | date: 'shortTime' }}</span>
        <p class="mt-0.5 text-zinc-200">{{ m.content }}</p>
      </div>
    }
  </div>
  @if (!disabled) {
    <div class="border-t border-zinc-800 p-2">
      @if (sendError) {
        <p class="mb-1 text-[11px] text-red-400">{{ sendError }}</p>
      }
      <div class="flex gap-1">
        <input
          type="text"
          [(ngModel)]="draft"
          (keydown.enter)="send()"
          placeholder="Message…"
          class="min-w-0 flex-1 rounded-lg border border-zinc-700 bg-zinc-950 px-2 py-1.5 text-xs text-zinc-100 placeholder:text-zinc-600"
        />
        <button
          type="button"
          (click)="send()"
          class="rounded-lg bg-zinc-800 px-2 py-1.5 text-xs text-amber-200/90 hover:bg-zinc-700"
        >
          Send
        </button>
      </div>
    </div>
  }
</div>
