$kind: http-request
name: Update Profile
order: 5000
method: PUT
url: '{{baseUrl}}/api/auth/profile'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "newname",
      "bio": "Chess enthusiast"
    }
