$kind: http-request
name: Reset Password
order: 12000
method: POST
url: '{{baseUrl}}/api/auth/reset-password'
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "password": "NewPassword123!"
    }
