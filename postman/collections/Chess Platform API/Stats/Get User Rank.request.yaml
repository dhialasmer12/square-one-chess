$kind: http-request
name: 'Get User Rank'
order: 4000
method: GET
url: '{{baseUrl}}/api/stats/user/:userId/rank'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
pathVariables:
  - key: userId
    value: '{{userId}}'
queryParams:
  - key: format
    value: classical
