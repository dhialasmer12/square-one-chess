$kind: http-request
name: Estimate Skill
order: 2000
method: POST
url: '{{baseUrl}}/api/ai/estimate-skill'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "gameId": "{{gameId}}"
    }
