$kind: http-request
name: Send Friend Request
order: 1000
method: POST
url: '{{baseUrl}}/api/friends/request'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "friendUsername": "player2"
    }
