$kind: http-request
name: 'Respond to Friend Request'
order: 2000
method: PUT
url: '{{baseUrl}}/api/friends/:requestId'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
pathVariables:
  - key: requestId
    value: '{{requestId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "action": "accept"
    }
