$kind: http-request
name: 'Get Tournament Chat'
order: 7000
method: GET
url: '{{baseUrl}}/api/tournaments/:tournamentId/chat'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
pathVariables:
  - key: tournamentId
    value: '{{tournamentId}}'
queryParams:
  - key: limit
    value: '100'
